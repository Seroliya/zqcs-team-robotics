<div id="crtc-robot-3d">
  <div class="viz-row" aria-label="结构视图">
    <button class="btn" type="button" data-view="whole" aria-pressed="true">整车</button>
    <button class="btn" type="button" data-view="feeder" aria-pressed="false">分料斗特写</button>
    <button class="btn" type="button" data-view="explode" aria-pressed="false">结构分层</button>
  </div>
  <div class="viz-controls">
    <label class="form-label">轮组外宽
      <select class="form-select" id="crtc3-width"><option value="135">窄轮组 135 mm</option><option value="185">宽轮组 185 mm</option></select>
    </label>
    <label class="form-label">翻转臂姿态
      <select class="form-select" id="crtc3-pose"><option value="feed">投料</option><option value="stow">收纳</option><option value="pick">地面夹取</option></select>
    </label>
  </div>
  <div class="crtc3-stage" role="group" aria-label="可拖动旋转的机器人三维结构，支持视角按钮和缩放按钮">
    <div class="crtc3-canvas"></div>
    <svg class="crtc3-labels" role="img" aria-label="机器人部件标注"></svg>
  </div>
  <div class="viz-row" aria-label="相机角度">
    <button class="btn btn-ghost" type="button" data-camera="iso">立体</button>
    <button class="btn btn-ghost" type="button" data-camera="top">俯视</button>
    <button class="btn btn-ghost" type="button" data-camera="side">侧视</button>
    <button class="btn btn-ghost" type="button" id="crtc3-zoom-in" aria-label="放大模型">放大</button>
    <button class="btn btn-ghost" type="button" id="crtc3-zoom-out" aria-label="缩小模型">缩小</button>
  </div>
  <div class="viz-controls">
    <label class="form-label">分料出口
      <select class="form-select" id="crtc3-lane"><option value="-1">左道</option><option value="0" selected>中道</option><option value="1">右道</option></select>
    </label>
    <button class="btn btn-primary" id="crtc3-play" type="button">演示一次装料</button>
  </div>
  <div id="crtc3-state" class="text-small" aria-live="polite">三维结构加载中</div>
  <div class="text-small text-muted">概念装配 · 非加工图 · 方块运动为预设轨迹</div>
</div>
<style>
  #crtc-robot-3d .crtc3-stage{position:relative; height:470px; touch-action:pan-y;}
  #crtc-robot-3d .crtc3-canvas{position:absolute; inset:0;}
  #crtc-robot-3d .crtc3-canvas canvas{display:block; width:100%; height:100%; touch-action:none; cursor:grab;}
  #crtc-robot-3d .crtc3-canvas canvas:active{cursor:grabbing;}
  #crtc-robot-3d .crtc3-labels{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:hidden;}
  #crtc-robot-3d .crtc3-labels text{font-size:12px; fill:var(--foreground);}
  #crtc-robot-3d .crtc3-labels line{stroke:var(--muted-foreground); stroke-width:1; opacity:.75;}
  #crtc-robot-3d .crtc3-labels circle{fill:var(--foreground);}
  @media(max-width:480px){#crtc-robot-3d .crtc3-stage{height:390px;}}
</style>

      {name:'臂根承力支架',p:[59,84,76],side:-1}
    ].map(q=>q.name==='翻转臂＋夹爪'?{...q,p:[q.p[0],q.p[1]+arm.position.y,q.p[2]]}:q);}
    function updateLabels(){labels.replaceChildren();labels.setAttribute('viewBox',`0 0 ${width} ${height}`);let items=labelData();if(width<480)items=items.filter(q=>view==='feeder'?['固定接料斗','转动导流槽','敞口料道 ×3'].includes(q.name):['翻转臂＋夹爪','分料斗','敞口料仓'].includes(q.name));const groups={1:[],'-1':[]};for(const it of items){const p=new T.Vector3(...it.p).project(camera),x=(p.x+1)*width/2,y=(1-p.y)*height/2;if(x<0||x>width||y<0||y>height)continue;groups[it.side].push({...it,x,y});}for(const side of [-1,1]){const group=groups[side].sort((a,b)=>a.y-b.y);let last=10;for(let i=0;i<group.length;i++){const q=group[i],ly=Math.min(height-15-(group.length-1-i)*25,Math.max(q.y,25,last+26)),tx=side<0?8:width-8,edge=side<0?90:width-90;last=ly;svgEl('line',{x1:q.x,y1:q.y,x2:edge,y2:ly-4});svgEl('circle',{cx:q.x,cy:q.y,r:2.4});svgEl('text',{x:tx,y:ly,'text-anchor':side<0?'start':'end'},q.name);}}}
    function render(){if(removed)return;cameraState();renderer.render(scene,camera);updateLabels();root.dataset.ready='true';root.dataset.armAngle=angle.toFixed(2);}
    function resize(){width=stage.clientWidth;height=stage.clientHeight;renderer.setSize(width,height,false);render();}
    function setPhase(phase){if(currentPhase===phase)return;currentPhase=phase;stateEl.textContent=phase;root.dataset.phase=phase;}
    function blockPosition(p,tilt=0){activeBlock.position.copy(p);activeBlock.rotation.set(0,0,tilt);}
    function disabled(on){widthEl.disabled=on;laneEl.disabled=on;poseEl.disabled=on||view==='feeder';for(const b of root.querySelectorAll('[data-view]'))b.disabled=on;playEl.disabled=on||view==='explode';}
    function frame(now){if(!running)return;const time=(now-animationStart)/1000,offset=view==='feeder'?3.8:0,t=time+offset;activeBlock.visible=true;const a=selectedLane*Math.asin(46/68),out=new T.Vector3(60-68*Math.cos(a),158,68*Math.sin(a));
      if(t<.9){setPhase('① 翻转臂下降，对准地面方块');updateArm(mix(release,pickup,smooth(t/.9)),28);blockPosition(armPoint(pickup));}
      else if(t<1.3){setPhase('② 夹爪闭合，接触方块框边');updateArm(pickup,mix(28,22,smooth((t-.9)/.4)));blockPosition(armPoint(pickup));}
      else if(t<3.4){setPhase('③ 翻转臂抬升，夹爪姿态由连杆保持');const p=updateArm(mix(pickup,release,smooth((t-1.3)/2.1)),22);blockPosition(p);}
      else if(t<3.8){setPhase('④ 对准接料斗，夹爪松开');updateArm(release,mix(22,28,(t-3.4)/.4));blockPosition(armPoint(release));}
      else if(t<4.5){setPhase('⑤ 方块进入固定接料斗');updateArm(release,28);const p=armPoint(release).lerp(new T.Vector3(60,184,0),smooth((t-3.8)/.7));blockPosition(p);}
      else if(t<5.5){setPhase('⑥ 导流槽送向'+(selectedLane<0?'左':selectedLane>0?'右':'中')+'道');const u=smooth((t-4.5));blockPosition(new T.Vector3(60,184,0).lerp(out,u),0);}
      else if(t<6.1){setPhase('⑦ 方块落入敞口料道');const u=smooth((t-5.5)/.6),end=new T.Vector3(out.x,floorY(out.x)+21,selectedLane*46);blockPosition(out.clone().lerp(end,u),u*20*Math.PI/180);}
      else if(t<7.4){setPhase('⑧ 沿料道滑到已有方块后方');const u=smooth((t-6.1)/1.3),x=mix(out.x,-41,u);blockPosition(new T.Vector3(x,floorY(x)+21,selectedLane*46),20*Math.PI/180);}
      else{running=false;disabled(false);setPhase('单块演示完成 · 分料轨迹仍需样件验证');root.dataset.animationComplete='true';}
      render();if(running)requestId=requestAnimationFrame(frame);
    }
    function play(){if(running||view==='explode')return;activeBlock.visible=true;root.dataset.animationComplete='false';currentPhase='';poseEl.value='feed';setChute();running=true;disabled(true);if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){updateArm(release,28);blockPosition(new T.Vector3(-41,floorY(-41)+21,selectedLane*46),20*Math.PI/180);running=false;disabled(false);setPhase('方块落入所选料道 · 已按减少动态效果偏好显示终态');root.dataset.animationComplete='true';render();return;}animationStart=performance.now();requestId=requestAnimationFrame(frame);}
    root.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
    widthEl.addEventListener('change',()=>{setWheelWidth();render();});
    poseEl.addEventListener('change',()=>{activeBlock.visible=false;updateArm(poseAngle(),26);render();});
    laneEl.addEventListener('change',()=>{selectedLane=Number(laneEl.value);activeBlock.visible=false;setChute();stateEl.textContent=(selectedLane<0?'左':selectedLane>0?'右':'中')+'道已对准 · 切换时导流槽内为空';render();});
    playEl.addEventListener('click',play);
    root.querySelectorAll('[data-camera]').forEach(b=>b.addEventListener('click',()=>{initialCamera=b.dataset.camera;if(initialCamera==='top'){pitch=1.53;yaw=0;}else if(initialCamera==='side'){pitch=.04;yaw=Math.PI/2;}else{pitch=.58;yaw=view==='feeder'?-.65:.78;}zoom=1;render();}));
    root.querySelector('#crtc3-zoom-in').addEventListener('click',()=>{zoom=Math.min(2.3,zoom*1.15);render();});
    root.querySelector('#crtc3-zoom-out').addEventListener('click',()=>{zoom=Math.max(.6,zoom/1.15);render();});
    let drag=null;
    renderer.domElement.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId);});
    renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-drag.x)*.008;pitch=Math.max(.03,Math.min(1.53,pitch+(e.clientY-drag.y)*.007));drag={x:e.clientX,y:e.clientY};render();});
    for(const name of ['pointerup','pointercancel'])renderer.domElement.addEventListener(name,()=>{drag=null;});
    renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.6,Math.min(2.3,zoom*Math.exp(-e.deltaY*.001)));render();},{passive:false});
    const themeObserver=new MutationObserver(()=>{for(const [key,name] of Object.entries(definitions))mats[key].color.copy(token(name));mats.frame.color.lerp(token('--background'),.25);mats.metal.color.lerp(token('--background'),.4);mats.rubber.color.lerp(token('--background'),.15);edgeMat.color.copy(token('--muted-foreground'));render();});
    themeObserver.observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{for(const [key,name]of Object.entries(definitions))mats[key].color.copy(token(name));render();});
    const resizeObserver=new ResizeObserver(resize);resizeObserver.observe(stage);
    setWheelWidth();updateArm(release,26);setChute();setLayers();resize();setView('whole');
    root.dataset.meshes=String(scene.children.reduce((n,g)=>{g.traverse(q=>{if(q.isMesh)n++;});return n;},0));
  }
  boot();
})();
</script>
